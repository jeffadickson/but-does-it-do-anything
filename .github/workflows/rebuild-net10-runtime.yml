name: Rebuild and verify .NET 10 browser runner
# Intentionally opt-in: runtime restore, Playwright and WASM publishing are expensive.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check .NET 10 runtime-rebuild utilities without SDK downloads
        run: python -m unittest discover -s lessons/languages-and-verification/java-futures-csharp-async/tests -p 'test_rebuild_runtime.py' -v
      - name: Install browser test dependencies
        working-directory: lessons/languages-and-verification/java-futures-csharp-async
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rebuild runtime assets using .NET 10, then test in Chromium
        working-directory: lessons/languages-and-verification/java-futures-csharp-async
        run: python tools/rebuild-runtime.py --test
      - name: Regenerate .NET 10 dependency lock, then run native verification
        working-directory: lessons/languages-and-verification/java-futures-csharp-async
        run: |
          dotnet restore tests/AsyncLab.Tests.csproj --force-evaluate
          node task.cjs native-test
      - name: Upload new runtime assets and validated NuGet lockfile
        uses: actions/upload-artifact@v4
        with:
          name: net10-roslyn-runtime-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            lessons/languages-and-verification/java-futures-csharp-async/app/csharp-runtime/
            lessons/languages-and-verification/java-futures-csharp-async/app/csharp-refs/
            lessons/languages-and-verification/java-futures-csharp-async/browser-runner/runtime-sha256.json
            lessons/languages-and-verification/java-futures-csharp-async/tests/packages.lock.json
