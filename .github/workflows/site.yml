name: Verify and publish lessons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: python -m unittest discover -s tests -v
      - run: node --test lessons/software-design/facade/tests/*.cjs
      - run: node lessons/mathematics/algebra-adventure/task.cjs build
      - run: git diff --exit-code -- lessons/mathematics/algebra-adventure/app
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Test instrument lab (no Docker)
        run: dotnet test lessons/software-testing/instrument-testing-lab/tests/InstrumentLab.Tests/InstrumentLab.Tests.csproj --filter FullyQualifiedName~WorkflowTests --configuration Release
      - name: Build and check async lesson
        run: |
          node lessons/languages-and-verification/java-futures-csharp-async/build.cjs
          node --test lessons/languages-and-verification/java-futures-csharp-async/tests/model.test.cjs
          git diff --exit-code -- lessons/languages-and-verification/java-futures-csharp-async/app
      - run: python tools/catalog.py check
      - run: python tools/catalog.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  algebra:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Provision and test using shell bootstrap
        if: runner.os != 'Windows'
        run: sh lessons/mathematics/algebra-adventure/setup.sh test
      - name: Provision and test using PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./lessons/mathematics/algebra-adventure/setup.ps1 test
      - name: Rerun setup to verify idempotence
        if: runner.os != 'Windows'
        run: sh lessons/mathematics/algebra-adventure/setup.sh doctor
      - name: Rerun Windows setup to verify idempotence
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./lessons/mathematics/algebra-adventure/setup.ps1 doctor
      - run: git diff --exit-code -- lessons/mathematics/algebra-adventure/app
  instrument-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Run xUnit / NSubstitute / WireMock tests
        run: dotnet test lessons/software-testing/instrument-testing-lab/tests/InstrumentLab.Tests/InstrumentLab.Tests.csproj --filter FullyQualifiedName~WorkflowTests --configuration Release
  instrument-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Verify real PostgreSQL round trip through Testcontainers
        run: dotnet test lessons/software-testing/instrument-testing-lab/tests/InstrumentLab.Tests/InstrumentLab.Tests.csproj --filter FullyQualifiedName~PostgresTests --configuration Release
  async-lesson:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lessons/languages-and-verification/java-futures-csharp-async
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.6+7'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node task.cjs test
      - run: node task.cjs native-test
      - run: git diff --exit-code -- app
  pages-status:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - uses: actions/github-script@v7
        id: status
        with:
          script: |
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) core.notice('Set Settings → Pages → Source to GitHub Actions, then rerun this workflow.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('One-time setup: Settings → Pages → Source → GitHub Actions. Then run this workflow again.');
            }
  deploy:
    needs: [build, algebra, instrument-unit, instrument-postgres, async-lesson, pages-status]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
