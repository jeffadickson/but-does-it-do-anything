name: Verify and publish lessons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test lessons/software-design/facade/tests/*.cjs
      - run: python tools/catalog.py check
      - run: python tools/catalog.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  pages-status:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - uses: actions/github-script@v7
        id: status
        with:
          script: |
            try {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) core.notice('Set Settings → Pages → Source to GitHub Actions, then rerun this workflow.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('One-time setup: Settings → Pages → Source → GitHub Actions. Then run this workflow again.');
            }
  deploy:
    needs: [build, pages-status]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
